name: Reader validation session
description: Record one reader-validation session (see reader-validation/README.md)
labels: [reader-validation]
body:
  - type: dropdown
    id: session
    attributes:
      label: Session
      options:
        - 1. Setup
        - 2. Foundations (ex10)
        - 3. Retrieval (ex37, ex39)
        - 4. Agents and security (ex42, ex54)
        - 5. Signature capstone, first stage (C1 milestone 1)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python and Node versions, and the release tag
      placeholder: "Ubuntu 24.04, Python 3.12.3, Node 24, v1.1.0"
    validations:
      required: true
  - type: input
    id: background
    attributes:
      label: Reader background
      description: Starting background, years of experience, prior Python/TypeScript/Docker use (no names)
      placeholder: "LLM app builder, 4 years; Python yes, TypeScript some, Docker yes"
    validations:
      required: true
  - type: input
    id: outcome
    attributes:
      label: Outcome
      description: Minutes to first passing test, minutes to "done when", and whether it was reached without help
      placeholder: "first test 18 min; done 75 min; done without help"
    validations:
      required: true
  - type: input
    id: hints
    attributes:
      label: Hint use and interventions
      description: Hints opened (1, 2, 3, table) and the number of observer interventions
      placeholder: "hint 1 and the table; 0 interventions"
    validations:
      required: true
  - type: textarea
    id: caveats
    attributes:
      label: Production caveats
      description: The reader's answer to "What does this exercise not protect against in production?" and the score (1 or 0)
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: Friction points
      description: One per line. File and line, what the reader expected, what happened, any hint given (word for word).
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What the reader would change
