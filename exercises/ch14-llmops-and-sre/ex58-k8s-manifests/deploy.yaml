apiVersion: apps/v1
kind: Deployment
metadata:
  name: answer-svc
spec:
  replicas: 1
  selector:
    matchLabels: {app: answer-svc}
  template:
    metadata:
      labels: {app: answer-svc}
    spec:
      containers:
        - name: app
          image: registry.example.com/answer-svc:latest
          env:
            - name: FDE_API_KEY
              value: sk-live-123
---
apiVersion: v1
kind: Service
metadata:
  name: answer-svc
spec:
  selector: {app: answer}
  ports:
    - port: 80
      targetPort: 8080
