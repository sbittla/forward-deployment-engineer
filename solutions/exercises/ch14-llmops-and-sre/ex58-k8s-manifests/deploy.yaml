apiVersion: apps/v1
kind: Deployment
metadata:
  name: answer-svc
  labels: {app: answer-svc}
spec:
  replicas: 2
  selector:
    matchLabels: {app: answer-svc}
  template:
    metadata:
      labels: {app: answer-svc}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: registry.example.com/answer-svc:1.0.3
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          env:
            - name: FDE_API_KEY
              valueFrom:
                secretKeyRef: {name: answer-svc, key: api-key}
            - name: FDE_API_BASE_URL
              value: https://api.example.com
---
apiVersion: v1
kind: Service
metadata:
  name: answer-svc
spec:
  selector: {app: answer-svc}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: answer-svc
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: answer-svc}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
