apiVersion: apps/v1
kind: Deployment
metadata:
  name: summarizer
  namespace: logistics-ai
spec:
  replicas: 3
  selector:
    matchLabels: {app: summarizer}
  template:
    metadata:
      labels: {app: summarizer}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: app
          image: registry.logistics.example/summarizer:2.0.0
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 5
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false}
          env:
            - name: PILOT_API_TOKENS
              valueFrom: {secretKeyRef: {name: summarizer, key: api-tokens}}
            - name: PILOT_LLM_ENDPOINT
              value: https://llm-gateway.logistics.example
            - name: PILOT_EGRESS_ALLOWLIST
              value: llm-gateway.logistics.example
            - name: HTTPS_PROXY
              value: http://proxy.logistics.example:3128
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/certs/corp-root.pem
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: summarizer
  namespace: logistics-ai
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: summarizer}
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
